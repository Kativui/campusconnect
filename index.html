<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusConnect</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <script src="auth.js"></script>

  <header class="navbar">
  <h1 class="logo">CampusConnect</h1>
    <button class="hamburger" id="navToggle" aria-label="Toggle navigation">
    <span></span><span></span><span></span>
  </button>
  <nav id="navMenu">

    <a href="announcements.html">Announcements</a>
    <a href="rooms.html">Rooms</a>

<section class="hero">
  <h2>Your Campus, Connected</h2>
  <p>Announcements, free classrooms, and student updates in one place.</p>
  <a href="#login" class="btn">Login with School Email</a>
</section>

<section class="login-section" id="login">
  <h2>Student Login</h2>
      <div class="role-toggle">
      <button type="button" class="role-btn active" data-role="student">Student</button>
      <button type="button" class="role-btn" data-role="lecturer">Lecturer</button>
    </div>
  <div class="login-box">
    <input type="email" id="email" placeholder="yourname@pwani.co.ke"> 
    <input type="password" id="password" placeholder="Password">
    <button id="loginBtn">Login</button>
    <p id="loginMessage"></p>
    
  </div>
</section>


  <script src="script.js"></script>
</body>
